name: Live audio endpoint smoke

on:
  workflow_dispatch:
    inputs:
      diagnose_song:
        description: Diagnose only the public song (no private credentials or other IDs required)
        required: false
        default: false
        type: boolean
      diagnostic_origin:
        description: Optional public HTTPS origin for song diagnostics (for example a deploy preview)
        required: false
        type: string
      drive_track_id:
        description: Approved public Drive catalog track ID
        required: false
        type: string
      song_id:
        description: Publicly published song ID
        required: true
        type: string
      song_version_id:
        description: Published master version ID for that song
        required: false
        type: string
      radio_track_id:
        description: Approved public radio preview track ID
        required: false
        type: string
      mix_id:
        description: Public room mix ID
        required: false
        type: string
      stem_pack_id:
        description: Owner-authorized private stem pack ID
        required: false
        type: string
      stem_type:
        description: Available stem type in the authorized pack
        required: false
        type: choice
        options:
          - full
          - drums
          - bass
          - music
          - vocals
          - fx

permissions:
  contents: read

jobs:
  smoke:
    name: Probe all five live audio streams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check HTTP audio and byte-range responses
        if: ${{ !inputs.diagnose_song }}
        run: node scripts/audio-endpoint-smoke.mjs
        env:
          HALO_AUDIO_PROBE_ORIGIN: ${{ vars.HALO_AUDIO_PROBE_ORIGIN }}
          HALO_AUDIO_PROBE_DRIVE_TRACK_ID: ${{ inputs.drive_track_id }}
          HALO_AUDIO_PROBE_SONG_ID: ${{ inputs.song_id }}
          HALO_AUDIO_PROBE_SONG_VERSION_ID: ${{ inputs.song_version_id }}
          HALO_AUDIO_PROBE_RADIO_TRACK_ID: ${{ inputs.radio_track_id }}
          HALO_AUDIO_PROBE_MIX_ID: ${{ inputs.mix_id }}
          HALO_AUDIO_PROBE_STEM_PACK_ID: ${{ inputs.stem_pack_id }}
          HALO_AUDIO_PROBE_STEM_TYPE: ${{ inputs.stem_type }}
          HALO_AUDIO_PROBE_AUTHORIZATION: ${{ secrets.HALO_AUDIO_PROBE_AUTHORIZATION }}
      - name: Diagnose the selected public Dreamweaver song
        if: ${{ inputs.diagnose_song }}
        run: node scripts/dreamweaver-live-diagnostic.mjs
        env:
          HALO_AUDIO_PROBE_ORIGIN: ${{ inputs.diagnostic_origin || vars.HALO_AUDIO_PROBE_ORIGIN }}
          HALO_AUDIO_PROBE_SONG_ID: ${{ inputs.song_id }}
      - uses: actions/setup-node@v4
        if: ${{ inputs.diagnose_song }}
        with:
          node-version: "24"
      - name: Check native Chrome playback on the public show
        if: ${{ inputs.diagnose_song }}
        run: node scripts/dreamweaver-live-browser.mjs
        env:
          HALO_AUDIO_PROBE_ORIGIN: ${{ inputs.diagnostic_origin || vars.HALO_AUDIO_PROBE_ORIGIN }}
          HALO_AUDIO_PROBE_SONG_ID: ${{ inputs.song_id }}
      - name: Compare native playback with bounded media ranges
        if: ${{ !cancelled() && inputs.diagnose_song }}
        run: node scripts/dreamweaver-live-browser.mjs
        env:
          HALO_AUDIO_PROBE_ORIGIN: ${{ inputs.diagnostic_origin || vars.HALO_AUDIO_PROBE_ORIGIN }}
          HALO_AUDIO_PROBE_SONG_ID: ${{ inputs.song_id }}
          HALO_AUDIO_PROBE_BOUND_RANGES: "1"
