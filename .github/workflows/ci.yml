name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-maintenance-contracts:
    name: AI + maintenance governance contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run AI and maintenance contract suite
        run: npm run contracts:ai-maintenance
      - name: Run deploy health contracts
        run: npm run deploy:feedback

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t halo-world:ci .
      - name: Run smoke test
        run: |
          docker run -d \
            --name halo-ci \
            -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL="" \
            -e JWT_SECRET="ci-test-secret" \
            halo-world:ci
          # Wait for the server to start
          timeout 30 bash -ec 'until curl --max-time 2 -sf http://127.0.0.1:3000/healthz; do
            test "$(docker inspect --format "{{.State.Running}}" halo-ci)" = true || exit 1
            sleep 1
          done'
          curl --max-time 2 -sf http://127.0.0.1:3000/healthz | grep '"status":"ok"'
      - name: Show container failure diagnostics
        if: ${{ failure() }}
        run: |
          docker inspect --format '{{json .State}}' halo-ci
          docker logs --tail 100 halo-ci
      - name: Clean up smoke-test container
        if: ${{ always() }}
        run: |
          if docker container inspect halo-ci > /dev/null 2>&1; then
            docker rm -f halo-ci
          fi
