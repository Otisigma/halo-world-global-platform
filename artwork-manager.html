<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALO MUSIC WORLD // ARTWORK MANAGER</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #070709;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .font-sans-alt {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #070709;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b0764;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" crossorigin="anonymous">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className }) => {
            const props = { className, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            
            switch (name) {
                case 'upload':
                    return <svg {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
                case 'image':
                    return <svg {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
                case 'trash-2':
                    return <svg {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
                case 'check-circle':
                    return <svg {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
                case 'x-circle':
                    return <svg {...props}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
                case 'arrow-left':
                    return <svg {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
                case 'music':
                    return <svg {...props}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
                default:
                    return <svg {...props}><circle cx="12" cy="12" r="10"/></svg>;
            }
        };

        const ARTWORK_FALLBACK = '/assets/halo-app-icon-512.png';

        function ArtworkManager() {
            const [artworks, setArtworks] = useState([
                { id: 1, title: 'Closest Thing To Heaven', artist: 'DJ Halo Mix', url: '/assets/releases/the-cold-is-lasting-longer.jpg', type: 'single', uploadDate: '2026-08-20' },
                { id: 2, title: 'Letting You Down Gently', artist: 'DJ Romy', url: '/assets/releases/salty.jpg', type: 'single', uploadDate: '2026-08-19' },
                { id: 3, title: 'My Decision', artist: 'DJ Butterfly', url: '/assets/releases/hit-that-beat.webp', type: 'album', uploadDate: '2026-08-18' }
            ]);

            const [newTitle, setNewTitle] = useState('');
            const [newArtist, setNewArtist] = useState('');
            const [newType, setNewType] = useState('single');
            const [pendingFiles, setPendingFiles] = useState([]);
            const [uploadQueue, setUploadQueue] = useState([]);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);
            const [logs, setLogs] = useState([
                '[BOOT] Artwork Manager System Online',
                '[READY] Select one or multiple cover images to upload...'
            ]);

            const addLog = (message) => {
                const timestamp = new Date().toLocaleTimeString();
                setLogs(prev => [`[${timestamp}] ${message}`, ...prev.slice(0, 15)]);
            };

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;

                const imageFiles = files.filter(f => f.type.startsWith('image/'));
                const skipped = files.length - imageFiles.length;
                if (skipped) addLog(`⚠️ SKIPPED: ${skipped} non-image file${skipped > 1 ? 's' : ''} ignored.`);
                if (!imageFiles.length) {
                    addLog('❌ ERROR: No image files found in selection.');
                    return;
                }

                const queue = imageFiles.map(file => ({
                    id: `pending-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    file,
                    previewUrl: null,
                    progress: 0,
                    status: 'pending'
                }));

                setUploadQueue(queue);
                setPendingFiles(imageFiles);
                addLog(`✓ SELECTED: ${imageFiles.length} image${imageFiles.length > 1 ? 's' : ''} ready for upload.`);

                // Generate previews for all selected files
                queue.forEach((item, index) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setUploadQueue(prev => prev.map((q, i) => i === index ? { ...q, previewUrl: event.target.result } : q));
                    };
                    reader.readAsDataURL(item.file);
                });
            };

            const handleUpload = async () => {
                if (!uploadQueue.length) {
                    addLog('❌ ERROR: No images selected.');
                    return;
                }
                if (!newArtist) {
                    addLog('❌ ERROR: Artist / DJ name is required.');
                    return;
                }

                setIsUploading(true);
                const today = new Date().toISOString().split('T')[0];
                const results = [];

                for (let i = 0; i < uploadQueue.length; i += 1) {
                    const item = uploadQueue[i];
                    const title = uploadQueue.length === 1 && newTitle ? newTitle :
                        item.file.name.replace(/\.[^/.]+$/, '') || item.file.name;

                    addLog(`🚀 UPLOADING (${i + 1}/${uploadQueue.length}): ${title}...`);

                    setUploadQueue(prev => prev.map((q, idx) => idx === i ? { ...q, status: 'uploading', progress: 0 } : q));

                    // Simulate per-file upload progress
                    await new Promise(resolve => {
                        let progress = 0;
                        const interval = setInterval(() => {
                            progress = Math.min(progress + Math.random() * 35, 100);
                            setUploadQueue(prev => prev.map((q, idx) => idx === i ? { ...q, progress } : q));
                            if (progress >= 100) {
                                clearInterval(interval);
                                resolve();
                            }
                        }, 120);
                    });

                    results.push({
                        id: Date.now() + i,
                        title,
                        artist: newArtist,
                        url: item.previewUrl,
                        type: newType,
                        uploadDate: today
                    });

                    setUploadQueue(prev => prev.map((q, idx) => idx === i ? { ...q, status: 'done', progress: 100 } : q));
                    addLog(`✅ COMPLETE: "${title}" added to library (${newType})`);
                }

                setArtworks(prev => [...results.reverse(), ...prev]);

                // Reset form
                setNewTitle('');
                setNewArtist('');
                setNewType('single');
                setUploadQueue([]);
                setPendingFiles([]);
                setIsUploading(false);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const deleteArtwork = (id) => {
                const artwork = artworks.find(a => a.id === id);
                setArtworks(prev => prev.filter(a => a.id !== id));
                addLog(`🗑️ DELETED: "${artwork.title}"`);
            };

            const exportAsJSON = () => {
                const json = JSON.stringify(artworks, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'halo-artwork-library.json';
                link.click();
                addLog('📥 EXPORTED: Artwork library downloaded as JSON');
            };

            return (
                <div className="min-h-screen bg-[#070709] text-gray-100 p-4 md:p-8">
                    
                    {/* HEADER */}
                    <header className="mb-8 border-b border-purple-950/40 pb-6">
                        <div className="flex items-center gap-3 mb-2">
                            <div className="p-2 bg-amber-950/40 rounded-lg border border-amber-500/50">
                                <Icon name="image" className="h-6 w-6 text-amber-400" />
                            </div>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-purple-400">
                                    ARTWORK MANAGER
                                </h1>
                                <p className="text-xs text-gray-400 uppercase tracking-widest mt-1">Upload & manage single covers & album artwork</p>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        {/* UPLOAD SECTION - Left Column */}
                        <section className="lg:col-span-1 space-y-4">
                            <div className="bg-[#0b0b11] border border-purple-950 rounded-xl p-6 space-y-5">
                                <h2 className="text-sm font-black uppercase tracking-widest text-amber-400 flex items-center gap-2">
                                    <Icon name="upload" className="h-4 w-4" />
                                    Upload Artwork
                                </h2>

                                {/* FILE INPUT DROP ZONE */}
                                <div 
                                    className="border-2 border-dashed border-amber-500/40 rounded-lg p-6 text-center bg-black/40 hover:bg-amber-950/10 transition cursor-pointer"
                                    onClick={() => fileInputRef.current?.click()}
                                >
                                    <Icon name="image" className="h-8 w-8 text-amber-400 mx-auto mb-2 animate-pulse" />
                                    <p className="text-xs font-bold text-white font-sans-alt">Click to select artwork</p>
                                    <p className="text-[10px] text-gray-400 mt-1 font-sans-alt">PNG, JPG, WebP · select multiple files at once</p>
                                    <input 
                                        ref={fileInputRef}
                                        type="file"
                                        multiple
                                        accept="image/png,image/jpeg,image/webp,image/gif,image/*"
                                        onChange={handleFileSelect}
                                        className="hidden"
                                    />
                                </div>

                                {/* SELECTED FILES PREVIEW */}
                                {uploadQueue.length > 0 && (
                                    <div className="space-y-2 max-h-48 overflow-y-auto">
                                        {uploadQueue.map((item) => (
                                            <div key={item.id} className="flex items-center gap-2 bg-black/40 border border-purple-900/40 rounded p-2">
                                                <div className="w-10 h-10 rounded overflow-hidden flex-shrink-0 bg-black border border-purple-900/40">
                                                    {item.previewUrl
                                                        ? <img src={item.previewUrl} alt="" className="w-full h-full object-cover" />
                                                        : <div className="w-full h-full flex items-center justify-center text-gray-600 text-[9px]">…</div>
                                                    }
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <p className="text-[10px] text-white truncate font-bold">{item.file.name}</p>
                                                    <p className="text-[9px] text-gray-500">{(item.file.size / 1024).toFixed(1)} KB</p>
                                                    {item.status === 'uploading' && (
                                                        <div className="mt-1 h-1 rounded-full bg-black/60 overflow-hidden">
                                                            <div className="h-full bg-gradient-to-r from-amber-500 to-purple-600 transition-all" style={{ width: `${Math.round(item.progress)}%` }}></div>
                                                        </div>
                                                    )}
                                                    {item.status === 'done' && <p className="text-[9px] text-emerald-400 font-bold">✓ Done</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* FORM FIELDS */}
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">
                                            {uploadQueue.length > 1 ? 'TITLE (optional — uses filename)' : 'SINGLE TITLE'}
                                        </label>
                                        <input 
                                            type="text" 
                                            value={newTitle}
                                            onChange={(e) => setNewTitle(e.target.value)}
                                            placeholder="e.g. Closest Thing To Heaven"
                                            className="w-full bg-black/60 border border-purple-900/60 rounded px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">ARTIST / DJ NAME *</label>
                                        <input 
                                            type="text" 
                                            value={newArtist}
                                            onChange={(e) => setNewArtist(e.target.value)}
                                            placeholder="e.g. DJ Halo Mix"
                                            className="w-full bg-black/60 border border-purple-900/60 rounded px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1.5">TYPE</label>
                                        <select 
                                            value={newType}
                                            onChange={(e) => setNewType(e.target.value)}
                                            className="w-full bg-black/60 border border-purple-900/60 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 transition"
                                        >
                                            <option value="single">Single Cover</option>
                                            <option value="album">Album Artwork</option>
                                            <option value="ep">EP Artwork</option>
                                        </select>
                                    </div>
                                </div>

                                {/* UPLOAD BUTTON */}
                                <button 
                                    onClick={handleUpload}
                                    disabled={isUploading || !uploadQueue.length || !newArtist}
                                    className="w-full bg-gradient-to-r from-amber-500 to-purple-600 hover:brightness-110 disabled:opacity-50 disabled:cursor-not-allowed text-black font-black uppercase py-3 rounded text-xs tracking-widest transition"
                                >
                                    {isUploading
                                        ? '🔄 UPLOADING...'
                                        : uploadQueue.length > 1
                                            ? `✓ ADD ${uploadQueue.length} TO LIBRARY`
                                            : '✓ ADD TO LIBRARY'}
                                </button>
                            </div>
                        </section>

                        {/* LIBRARY & LOGS - Right Columns */}
                        <section className="lg:col-span-2 grid grid-cols-1 lg:grid-cols-2 gap-8">
                             
                            {/* ARTWORK LIBRARY */}
                            <div className="bg-[#0b0b11] border border-purple-950 rounded-xl p-6 space-y-4">
                                <h2 className="text-sm font-black uppercase tracking-widest text-rose-400 flex items-center gap-2">
                                    <Icon name="music" className="h-4 w-4" />
                                    Library ({artworks.length})
                                </h2>
                                 
                                <div className="space-y-3 max-h-[600px] overflow-y-auto">
                                    {artworks.map((art) => (
                                        <div key={art.id} className="bg-black/40 border border-purple-950/60 rounded-lg p-3 flex gap-3 hover:border-purple-800 transition">
                                            <div className="w-12 h-12 rounded overflow-hidden flex-shrink-0 border border-purple-900/60 bg-black">
                                                <img
                                                    src={art.url}
                                                    alt={art.title}
                                                    className="w-full h-full object-cover"
                                                    onError={e => { e.currentTarget.src = ARTWORK_FALLBACK; e.currentTarget.onerror = null; }}
                                                />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-xs font-bold text-white truncate">{art.title}</p>
                                                <p className="text-[10px] text-gray-400 truncate">{art.artist}</p>
                                                <div className="flex gap-2 mt-1">
                                                    <span className="text-[9px] bg-amber-950/40 text-amber-300 px-1.5 py-0.5 rounded uppercase font-bold">{art.type}</span>
                                                    <span className="text-[9px] text-gray-500">{art.uploadDate}</span>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => deleteArtwork(art.id)}
                                                className="text-red-400 hover:text-red-300 transition p-1 flex-shrink-0"
                                            >
                                                <Icon name="trash-2" className="h-4 w-4" />
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={exportAsJSON}
                                    className="w-full bg-emerald-950/40 hover:bg-emerald-900/40 border border-emerald-500/50 text-emerald-300 font-bold py-2 rounded text-xs uppercase tracking-wider transition"
                                >
                                    📥 Export Library as JSON
                                </button>
                            </div>

                            {/* SYSTEM LOGS */}
                            <div className="bg-[#0b0b11] border border-purple-950 rounded-xl p-6 space-y-4">
                                <h2 className="text-sm font-black uppercase tracking-widest text-cyan-400 flex items-center gap-2">
                                    <div className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                                    System Logs
                                </h2>
                                 
                                <div className="bg-black/60 border border-purple-950/80 p-3 rounded-lg font-mono text-[9px] text-gray-300 space-y-1 max-h-[600px] overflow-y-auto leading-relaxed">
                                    {logs.map((log, i) => (
                                        <p key={i} className="hover:text-white transition">{log}</p>
                                    ))}
                                </div>
                            </div>
                        </section>
                    </div>

                    {/* FOOTER */}
                    <footer className="mt-12 border-t border-purple-950/40 pt-6 text-center text-[10px] text-gray-500 space-y-2">
                        <p>© 2026 HALO MUSIC WORLD - Artwork Manager v1.1</p>
                        <a href="/halo.html" className="text-amber-400 hover:underline font-bold">← Return to Main Console</a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArtworkManager />);
    </script>
</body>
</html>
