<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">HALO premium placeholder cover</title>
  <desc id="desc">Branded fallback artwork for HALO music releases.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d19"/>
      <stop offset="48%" stop-color="#0a0d0b"/>
      <stop offset="100%" stop-color="#1a140d"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="78%">
      <stop offset="0%" stop-color="#f2ff62" stop-opacity=".38"/>
      <stop offset="42%" stop-color="#f2ff62" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#f2ff62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ff62"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <rect x="56" y="56" width="1088" height="1088" fill="none" stroke="rgba(255,255,255,.16)"/>
  <rect x="92" y="92" width="1016" height="1016" rx="14" fill="none" stroke="rgba(255,255,255,.08)"/>
  <path d="M0 920L1200 620V1200H0Z" fill="rgba(255,122,69,.08)"/>
  <g transform="translate(132 142)">
    <text x="0" y="0" fill="#f2ff62" font-family="Arial, sans-serif" font-size="38" letter-spacing="18">HALO</text>
    <text x="0" y="72" fill="#f2eee3" font-family="Arial, sans-serif" font-size="146" font-weight="700" letter-spacing="-7">SIGNAL</text>
    <text x="0" y="144" fill="#c5ccc4" font-family="Arial, sans-serif" font-size="28" letter-spacing="8">PREMIUM PLACEHOLDER COVER</text>
  </g>
  <g transform="translate(600 650)">
    <circle r="192" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".9"/>
    <circle r="152" fill="none" stroke="rgba(242,238,227,.22)" stroke-width="1.5"/>
    <path d="M-98 110v-228h48l83 94 83-94h48v228h-54v-137l-77 83-77-83v137z" fill="#f2eee3"/>
    <rect x="-210" y="-210" width="420" height="420" rx="210" fill="none" stroke="rgba(242,255,98,.12)" stroke-width="28"/>
  </g>
  <g transform="translate(132 1004)">
    <text x="0" y="0" fill="#f2eee3" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="2">OFFICIAL HALO ARTWORK FALLBACK</text>
    <text x="0" y="52" fill="#9da69d" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">ARTIST-CONTROLLED SHOP FRONT · COVER HELD UNTIL RELEASE ART ARRIVES</text>
  </g>
