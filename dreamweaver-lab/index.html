<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dreamweaver Song Lab</title>
  </head>
  <body>
    <main>
      <label class="drop-zone drop-zone--artwork" id="artworkDropZone">
        <input id="artworkFile" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" />
        <span class="drop-mark" aria-hidden="true">IMG</span>
        <strong id="artworkDropTitle">Add cover artwork <small>Optional</small></strong>
        <small id="artworkDropDetail">JPG, PNG, or WebP · square recommended · up to 20 MB</small>
      </label>
    </main>
  </body>
</html>
