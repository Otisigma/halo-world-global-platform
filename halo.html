    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #070709;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .font-sans-alt {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #070709;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b0764;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }
        #celebration-overlay {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
        }
        .glow-halo {
            box-shadow: 0 0 50px rgba(217, 119, 6, 0.25), 0 0 100px rgba(168, 85, 247, 0.15);
        }
        .exchange-grid {
            background-image:
                linear-gradient(rgba(245, 158, 11, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 158, 11, 0.045) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        .signal-track {
            position: relative;
        }
        .signal-track::before {
            content: '';
            position: absolute;
            left: 1rem;
            top: 2rem;
            bottom: 2rem;
            width: 1px;
            background: linear-gradient(to bottom, #f59e0b, #a855f7, #22d3ee);
            opacity: 0.55;
        }
        .signal-node {
            box-shadow: 0 0 0 5px #0a0a0f, 0 0 18px currentColor;
        }
        .signal-scan {
            animation: signal-scan 3.8s ease-in-out infinite;
        }
        .takeover-stage {
            background:
                radial-gradient(circle at 82% 18%, rgba(245, 158, 11, 0.12), transparent 28%),
                linear-gradient(135deg, rgba(10, 10, 15, 0.98), rgba(17, 10, 22, 0.96));
        }
        .takeover-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 48px;
        }
        .takeover-wave span {
            width: 3px;
            height: var(--bar-height);
            border-radius: 999px;
            background: linear-gradient(to top, rgba(245, 158, 11, 0.35), #fbbf24);
            transform-origin: center;
            animation: takeover-pulse 1.4s ease-in-out infinite alternate;
            animation-delay: var(--bar-delay);
        }
        .takeover-number {
            -webkit-text-stroke: 1px rgba(245, 158, 11, 0.35);
            color: transparent;
        }
        .release-spotlight {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 20%, rgba(199, 224, 232, 0.2), transparent 28%),
                radial-gradient(circle at 86% 78%, rgba(217, 119, 6, 0.14), transparent 30%),
                linear-gradient(128deg, #10171b 0%, #080a0d 52%, #17100d 100%);
        }
        .release-spotlight::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(115deg, transparent 0 46%, rgba(255,255,255,.035) 46% 46.4%, transparent 46.4% 100%),
                linear-gradient(rgba(210, 230, 235, .035) 1px, transparent 1px);
            background-size: auto, 100% 22px;
            mask-image: linear-gradient(to right, black, transparent 78%);
        }
        .release-art-shell {
            position: relative;
            transform: rotate(-2deg);
            box-shadow: 0 30px 70px rgba(0, 0, 0, .55);
            transition: transform 500ms cubic-bezier(.2,.8,.2,1), box-shadow 500ms ease;
        }
        .release-spotlight:hover .release-art-shell {
            transform: rotate(-.5deg) translateY(-5px);
            box-shadow: 0 38px 90px rgba(0, 0, 0, .65);
        }
        .release-art-shell::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border: 1px solid rgba(226, 238, 240, .22);
            box-shadow: inset 0 0 45px rgba(224, 239, 242, .08);
        }
        .release-stamp {
            transform: rotate(3deg);
            box-shadow: 0 12px 28px rgba(0,0,0,.35);
        }
        .artist-role {
            position: relative;
            overflow: hidden;
        }
        .artist-role::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.07), transparent 78%);
            transform: translateX(-120%);
            transition: transform 650ms cubic-bezier(.2,.8,.2,1);
        }
        .artist-role:hover::after {
            transform: translateX(120%);
        }
        .release-title {
            font-family: 'Barlow Condensed', sans-serif;
            text-wrap: balance;
        }
        .release-title em {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }
        .release-rule {
            transform-origin: left center;
            animation: release-rule-in 1.1s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes release-rule-in {
            from { opacity: 0; transform: scaleX(.08); }
            to { opacity: 1; transform: scaleX(1); }
        }
        .headline-gradient-glow {
            position: relative;
            isolation: isolate;
            color: transparent;
            background: linear-gradient(110deg, #fbbf24 0%, #f59e0b 28%, #d8b4fe 58%, #9333ea 82%, #fbbf24 100%);
            background-size: 240% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: headline-gradient-shift 5.5s ease-in-out infinite;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.3)) drop-shadow(0 0 18px rgba(147, 51, 234, 0.24));
        }
        .headline-gradient-glow::before {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            z-index: -1;
            color: transparent;
            background: inherit;
            background-clip: text;
            -webkit-background-clip: text;
            filter: blur(14px);
            opacity: 0.55;
            animation: headline-glow-pulse 3.6s ease-in-out infinite;
        }
        @keyframes headline-gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes headline-glow-pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.995); }
            50% { opacity: 0.72; transform: scale(1.01); }
        }
        @keyframes signal-scan {
            0%, 100% { opacity: 0.35; transform: scaleX(0.45); }
            50% { opacity: 1; transform: scaleX(1); }
        }
        @keyframes takeover-pulse {
            from { opacity: 0.35; transform: scaleY(0.55); }
            to { opacity: 1; transform: scaleY(1); }
        }
        .community-orbit {
            background:
                radial-gradient(circle at 15% 10%, rgba(251, 191, 36, 0.14), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(236, 72, 153, 0.12), transparent 30%),
                linear-gradient(145deg, rgba(20, 13, 27, 0.98), rgba(6, 6, 10, 0.98));
        }
        .constellation-grid {
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 22px 22px;
        }
        .light-received {
            animation: light-received 700ms cubic-bezier(.2,.8,.2,1);
        }
        .world-display {
            font-family: 'Barlow Condensed', sans-serif;
        }
        .world-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        .world-stage {
            --world-accent: 251, 191, 36;
            position: relative;
            min-height: 520px;
            isolation: isolate;
            overflow: hidden;
            background: #09090d;
            transition: background 700ms ease;
        }
        .world-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 18;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,.035), transparent 2px);
            background-size: 5px 100%;
            mix-blend-mode: soft-light;
            opacity: .25;
        }
        .world-party {
            --world-accent: 229, 72, 108;
            background:
                radial-gradient(circle at 50% 62%, rgba(229,72,108,.28), transparent 34%),
                radial-gradient(circle at 18% 16%, rgba(190,242,100,.12), transparent 24%),
                linear-gradient(165deg, #17090f 0%, #0b0910 52%, #050608 100%);
        }
        .world-beach {
            --world-accent: 232, 167, 93;
            background:
                radial-gradient(circle at 72% 20%, rgba(255,213,153,.3), transparent 16%),
                linear-gradient(180deg, #30203b 0%, #a34f59 44%, #d68f68 58%, #162f37 59%, #07191f 100%);
        }
        .world-lounge {
            --world-accent: 190, 151, 90;
            background:
                radial-gradient(ellipse at 72% 40%, rgba(190,151,90,.2), transparent 24%),
                linear-gradient(145deg, #21130f 0%, #0c1110 48%, #050807 100%);
        }
        .world-vignette {
            position: absolute;
            inset: 0;
            z-index: 16;
            pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0,0,0,.82);
        }
        .world-stars {
            position: absolute;
            inset: 0 0 42% 0;
            opacity: .6;
            background-image:
                radial-gradient(circle at 12% 22%, white 0 1px, transparent 1.5px),
                radial-gradient(circle at 28% 16%, white 0 1px, transparent 1.5px),
                radial-gradient(circle at 46% 28%, white 0 1px, transparent 1.5px),
                radial-gradient(circle at 63% 12%, white 0 1px, transparent 1.5px),
                radial-gradient(circle at 83% 24%, white 0 1px, transparent 1.5px),
                radial-gradient(circle at 92% 10%, white 0 1px, transparent 1.5px);
            animation: world-stars 5s ease-in-out infinite alternate;
        }
        .world-sun {
            position: absolute;
            right: 13%;
            top: 15%;
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #f4c493;
            box-shadow: 0 0 48px rgba(244,196,147,.55);
            opacity: 0;
            transform: scale(.7);
            transition: opacity 500ms ease, transform 700ms ease;
        }
        .world-beach .world-sun { opacity: 1; transform: scale(1); }
        .world-horizon {
            position: absolute;
            inset: 58% 0 auto;
            height: 2px;
            z-index: 3;
            background: rgba(var(--world-accent), .5);
            box-shadow: 0 0 30px rgba(var(--world-accent), .3);
        }
        .world-floor {
            position: absolute;
            z-index: 2;
            left: -15%;
            right: -15%;
            bottom: -28%;
            height: 72%;
            transform: perspective(320px) rotateX(62deg);
            transform-origin: center top;
            background-image:
                linear-gradient(rgba(var(--world-accent), .2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--world-accent), .18) 1px, transparent 1px);
            background-size: 42px 34px;
            mask-image: linear-gradient(to bottom, transparent, black 20%);
            opacity: .42;
        }
        .world-beach .world-floor {
            background-image: repeating-radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.15) 0 1px, transparent 2px 14px);
            opacity: .6;
        }
        .world-lounge .world-floor { opacity: .16; }
        .world-beam {
            position: absolute;
            z-index: 4;
            top: 1%;
            width: 18%;
            height: 78%;
            transform-origin: top center;
            clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
            background: linear-gradient(to bottom, rgba(var(--world-accent), .48), transparent 78%);
            filter: blur(2px);
            mix-blend-mode: screen;
            animation: world-beam 5.2s ease-in-out infinite alternate;
        }
        .world-beam-one { left: 18%; transform: rotate(20deg); }
        .world-beam-two { right: 16%; transform: rotate(-24deg); animation-delay: -2.2s; }
        .world-beach .world-beam, .world-lounge .world-beam { opacity: .18; }
        .world-booth {
            position: absolute;
            z-index: 8;
            left: 50%;
            bottom: 18%;
            width: min(38%, 260px);
            height: 76px;
            transform: translateX(-50%);
            border: 1px solid rgba(var(--world-accent), .55);
            background: linear-gradient(180deg, rgba(20,20,25,.92), rgba(4,4,6,.98));
            box-shadow: 0 -10px 40px rgba(var(--world-accent), .16);
            clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
        }
        .world-booth::before {
            content: 'HALO';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(var(--world-accent), .86);
            font: 800 26px/1 'Barlow Condensed', sans-serif;
            letter-spacing: .32em;
            text-indent: .32em;
        }
        .world-lounge .world-booth {
            width: 32%;
            height: 54px;
            bottom: 22%;
            border-radius: 50%;
            clip-path: none;
        }
        .world-palms {
            position: absolute;
            z-index: 5;
            inset: auto 0 29% 0;
            height: 150px;
            opacity: 0;
            transition: opacity 500ms ease;
            background:
                linear-gradient(72deg, transparent 47%, #081113 48% 51%, transparent 52%) 7% 100%/80px 135px no-repeat,
                linear-gradient(104deg, transparent 47%, #081113 48% 51%, transparent 52%) 93% 100%/80px 145px no-repeat;
        }
        .world-beach .world-palms { opacity: 1; }
        .world-crowd {
            position: absolute;
            z-index: 10;
            inset: auto -2% 0;
            height: 34%;
            background:
                radial-gradient(ellipse at 4% 100%, #050507 0 34px, transparent 35px),
                radial-gradient(ellipse at 13% 100%, #050507 0 48px, transparent 49px),
                radial-gradient(ellipse at 24% 100%, #050507 0 40px, transparent 41px),
                radial-gradient(ellipse at 36% 100%, #050507 0 55px, transparent 56px),
                radial-gradient(ellipse at 49% 100%, #050507 0 43px, transparent 44px),
                radial-gradient(ellipse at 62% 100%, #050507 0 52px, transparent 53px),
                radial-gradient(ellipse at 75% 100%, #050507 0 42px, transparent 43px),
                radial-gradient(ellipse at 87% 100%, #050507 0 52px, transparent 53px),
                radial-gradient(ellipse at 97% 100%, #050507 0 38px, transparent 39px);
            transition: height 600ms ease, opacity 400ms ease;
        }
        .world-beach .world-crowd { height: 25%; opacity: .82; }
        .world-lounge .world-crowd { height: 19%; opacity: .46; }
        .world-bass {
            position: absolute;
            z-index: 7;
            left: 50%;
            bottom: 19%;
            width: 80px;
            height: 80px;
            border: 1px solid rgba(var(--world-accent), .6);
            border-radius: 50%;
            transform: translate(-50%, 50%) scale(.2);
            opacity: 0;
        }
        .bass-active .world-bass { animation: world-bass 1.15s ease-out infinite; }
        .world-fireworks {
            position: absolute;
            z-index: 6;
            inset: 5% 5% 38%;
            opacity: 0;
            transition: opacity 300ms ease;
        }
        .cinematic-fireworks .world-fireworks, .world-party .world-fireworks { opacity: 1; }
        .world-firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            color: rgb(var(--world-accent));
            box-shadow: 0 -36px currentColor, 25px -25px currentColor, 36px 0 currentColor, 25px 25px currentColor, 0 36px currentColor, -25px 25px currentColor, -36px 0 currentColor, -25px -25px currentColor;
            animation: world-firework 2.8s ease-out infinite;
        }
        .world-firework:nth-child(1) { left: 19%; top: 26%; }
        .world-firework:nth-child(2) { right: 18%; top: 12%; animation-delay: -1.2s; transform: scale(.7); }
        .world-firework:nth-child(3) { left: 52%; top: 6%; animation-delay: -2s; transform: scale(.5); }
        .world-drone {
            position: absolute;
            z-index: 20;
            inset: 14px 14px auto auto;
            width: 112px;
            height: 66px;
            border: 1px solid rgba(255,255,255,.35);
            opacity: 0;
            background: rgba(5,7,8,.54);
            backdrop-filter: blur(6px);
        }
        .world-drone::before, .world-drone::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,.45);
        }
        .world-drone::before { left: 50%; top: 0; bottom: 0; width: 1px; }
        .world-drone::after { top: 50%; left: 0; right: 0; height: 1px; }
        .cinematic-drone .world-drone { animation: world-drone 3.6s ease-in-out both; }
        .world-ground-shot {
            position: absolute;
            z-index: 15;
            inset: auto 0 0;
            height: 45%;
            opacity: 0;
            background: linear-gradient(to top, rgba(var(--world-accent), .2), transparent);
            transform-origin: center bottom;
        }
        .cinematic-ground .world-ground-shot { animation: world-ground-shot 3.2s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes world-stars { to { opacity: 1; transform: translateY(3px); } }
        @keyframes world-beam { from { transform: rotate(15deg) scaleX(.75); opacity: .45; } to { transform: rotate(-8deg) scaleX(1.15); opacity: .9; } }
        @keyframes world-bass { 0% { opacity: .7; transform: translate(-50%,50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%,50%) scale(6); } }
        @keyframes world-firework { 0%, 12% { opacity: 0; transform: scale(.08); } 30% { opacity: 1; } 72%, 100% { opacity: 0; transform: scale(1.15); } }
        @keyframes world-drone { 0% { opacity: 0; transform: translate(-380px, 130px) rotate(-6deg); } 18%, 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-35px, 12px) rotate(2deg); } }
        @keyframes world-ground-shot { 0% { opacity: 0; transform: perspective(300px) rotateX(55deg) scale(2.4) translateY(45%); } 22% { opacity: 1; } 100% { opacity: 0; transform: perspective(300px) rotateX(55deg) scale(.72) translateY(-20%); } }
        @keyframes light-received {
            0% { transform: scale(.92); opacity: .45; filter: brightness(1); }
            55% { transform: scale(1.025); opacity: 1; filter: brightness(1.65); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .movement-stage {
            isolation: isolate;
            background:
                radial-gradient(circle at 12% 18%, rgba(245, 158, 11, .16), transparent 28%),
                radial-gradient(circle at 92% 82%, rgba(34, 211, 238, .11), transparent 32%),
                linear-gradient(142deg, #100d0b 0%, #0a090d 43%, #071013 100%);
        }
        .movement-stage::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -2;
            opacity: .26;
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom right, black, transparent 72%);
        }
        .movement-stage::after {
            content: 'TAKE PART';
            position: absolute;
            right: -1rem;
            bottom: -2.3rem;
            z-index: -1;
            color: transparent;
            font: 900 clamp(5rem, 16vw, 12rem)/.75 'Barlow Condensed', sans-serif;
            letter-spacing: -.05em;
            -webkit-text-stroke: 1px rgba(245, 158, 11, .12);
            white-space: nowrap;
        }
        .movement-signal {
            position: absolute;
            top: 2.5rem;
            right: 2.5rem;
            width: 6.5rem;
            aspect-ratio: 1;
            border: 1px solid rgba(245, 158, 11, .35);
            border-radius: 999px;
            animation: movement-signal 4.5s ease-in-out infinite;
        }
        .movement-signal::before,
        .movement-signal::after {
            content: '';
            position: absolute;
            border-radius: inherit;
            border: 1px solid rgba(34, 211, 238, .2);
        }
        .movement-signal::before { inset: .8rem; }
        .movement-signal::after { inset: 2rem; background: #f2b84b; border: 0; box-shadow: 0 0 28px rgba(245, 158, 11, .45); }
        .movement-role {
            background: linear-gradient(110deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
            transition: transform 220ms ease, border-color 220ms ease, background-color 220ms ease;
        }
        .movement-role:hover {
            transform: translateX(.35rem);
            border-color: rgba(245, 158, 11, .42);
            background-color: rgba(245, 158, 11, .035);
        }
        @keyframes movement-signal {
            0%, 100% { transform: scale(.92); opacity: .65; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .artist-pro-takeover {
            --pointer-x: 0deg;
            --pointer-y: 0deg;
            position: relative;
            isolation: isolate;

                setTracks(previousTracks => [...previousTracks]);
                setProcessingStatus(`${track.title} is ready to play.`);
              }
              if (!track.binaryBuffer) throw new Error('This audio file could not be decoded by the browser.');
              addLog(`DIRECT MEMORY STREAM: Playing 24-bit binary buffer for "${track.title}"`);
              const source = ctx.createBufferSource();
              source.buffer = track.binaryBuffer;
              source.loop = true;
              source.connect(gainNodeRef.current);
              source.start(0);
              activeSourceNodeRef.current = source;
            } else {
              throw new Error('Choose an audio file to hear this track. Catalog entries provide set-planning details, not the recording itself.');
            }
          };

            }

                addLog(`AUDIO FILE NEEDED: "${activeTrack.title}" has catalog details but no recording attached.`);
                singleFileInputRef.current?.click();
                return;

              initAudio();

            if (playableTracks.length) {
              if (decision.strategy === 'reset') {
                strategicTrack = [...playableTracks].sort((a, b) => a.bpm - b.bpm)[0];
              } else if (decision.strategy === 'build' || decision.strategy === 'release') {
                strategicTrack = [...playableTracks].sort((a, b) => b.bpm - a.bpm)[0];
              } else if (decision.strategy === 'novelty') {
                strategicTrack = tracks.find(track => track.isBinarySource) || playableTracks.find(track => track.id !== activeTrack.id) || activeTrack;
              } else if (decision.strategy === 'unify') {
                strategicTrack = playableTracks.reduce((closest, track) => {
                  const targetTempo = 122;
                  return Math.abs(track.bpm - targetTempo) < Math.abs(closest.bpm - targetTempo) ? track : closest;
                }, playableTracks[0]);
              }

            const api = window.haloIdentity;
            if (!api) {
              setIdentityError('Membership is still loading. Please try again in a moment.');
              return;
            }

            setIdentityBusy(true);
            setIdentityError('');
            setIdentityNotice('');
            try {
              if (identityMode === 'signup') {
                const user = await api.signup(identityForm.email.trim(), identityForm.password, { full_name: identityForm.name.trim() });
                if (user?.emailVerified) {
                  setIdentityUser(user);
                  setShowIdentityModal(false);
                  setIdentityNotice('Welcome to the HALO community.');
                } else {
                  setIdentityNotice('Check your inbox to confirm your membership, then sign in.');
                  setIdentityMode('login');
                }
              } else {
                const user = await api.login(identityForm.email.trim(), identityForm.password);
                setIdentityUser(user);
                setShowIdentityModal(false);
                setIdentityNotice(`Welcome back${user?.name ? `, ${user.name}` : ''}.`);
              }
              window.haloStats?.track(identityMode === 'signup' ? 'community_signup' : 'community_login');
              await loadCommunity();
            } catch (error) {
              setIdentityError(error?.status === 401 ? 'The email or password did not match.' : (error?.message || 'Membership could not be completed.'));
            } finally {
              setIdentityBusy(false);
            }
          };

          const signOut = async () => {
            try {
              await window.haloIdentity?.logout();
            } finally {
              window.location.replace('/');
            }
          };

          const saveCommunityProfile = async (event) => {
            event.preventDefault();
            if (!profileDraft) return;
            await communityAction({
              action: 'profile',
              displayName: profileDraft.displayName,
              avatar: profileDraft.avatar,
              region: profileDraft.region,
              favoriteGenres: profileDraft.favoriteGenres.split(',').map(item => item.trim()).filter(Boolean),
              vibeStatus: profileDraft.vibeStatus
            }, 'Your fan signal is updated.');
            window.haloStats?.track('community_profile_updated');
          };

          const submitCommunityMessage = async (event) => {
            event.preventDefault();
            if (!newComment.trim()) return;
            const sent = await communityAction({ action: 'message', body: newComment, replyTo: communityReply?.id || null });
            if (sent) {
              setNewComment('');
              setCommunityReply(null);
              window.haloStats?.track('send_community_message');
            }
          };

          const submitRoomPost = async (event) => {
            event.preventDefault();
            const posted = await communityAction({
              action: 'room_post',
              title: roomPostDraft.title,
              description: roomPostDraft.description,
              videoUrl: roomPostDraft.videoUrl,
              options: roomPostDraft.options
            }, 'Video posted to your room. Fans can watch, discuss, and vote.');
            if (posted) {
              setRoomPostDraft({ title: '', description: '', videoUrl: '', options: ['', ''] });
              setShowRoomComposer(false);
              setActiveTab('party');
            }
          };

          const updateEqualizer = (band, value) => {
            const numericValue = Number(value);
            const next = { ...equalizer, [band]: numericValue };
            setEqualizer(next);
            initAudio();
            const now = audioCtxRef.current?.currentTime || 0;
            if (band === 'master' && gainNodeRef.current) gainNodeRef.current.gain.setTargetAtTime(numericValue / 100, now, 0.03);
            if (band === 'bass' && bassNodeRef.current) bassNodeRef.current.gain.setTargetAtTime(numericValue, now, 0.03);
            if (band === 'mid' && midNodeRef.current) midNodeRef.current.gain.setTargetAtTime(numericValue, now, 0.03);
            if (band === 'treble' && trebleNodeRef.current) trebleNodeRef.current.gain.setTargetAtTime(numericValue, now, 0.03);
            if (band === 'master') document.querySelectorAll('audio').forEach(audio => { audio.volume = Math.min(1, numericValue / 100); });
          };

          const resetEqualizer = () => {
            const balanced = { master: 70, bass: 0, mid: 0, treble: 0 };
            setEqualizer(balanced);
            initAudio();
            const now = audioCtxRef.current?.currentTime || 0;
            gainNodeRef.current?.gain.setTargetAtTime(0.7, now, 0.03);
            bassNodeRef.current?.gain.setTargetAtTime(0, now, 0.03);
            midNodeRef.current?.gain.setTargetAtTime(0, now, 0.03);
            trebleNodeRef.current?.gain.setTargetAtTime(0, now, 0.03);
            document.querySelectorAll('audio').forEach(audio => { audio.volume = 0.7; });
          };

          const supportFan = async (person, kind, gift = null) => {
            const labels = { light: `Light passed to ${person.display_name}.`, boost: `${person.display_name} is boosted for today.`, gift: `${person.display_name} received a ${gift}.` };
            const sent = await communityAction({ action: 'support', targetId: person.actor_id, kind, gift }, labels[kind]);
            if (sent) {
              setSupportBurst(person.actor_id);
              window.setTimeout(() => setSupportBurst(''), 720);
              window.haloStats?.track(`community_${kind}_sent`);
            }
          };

          const reportCommunityItem = async ({ targetId = null, messageId = null }) => {
            const reason = window.prompt('Tell the HALO review team what happened.');
            if (!reason) return;
            await communityAction({ action: 'report', targetId, messageId, reason }, 'Report received for human review.');
          };

          const inviteToRoom = async () => {
            const invite = { title: 'Join my HALO room', text: 'The listening party is live. Meet me in the HALO clubhouse.', url: window.location.href };
            try {
              if (navigator.share) await navigator.share(invite);
              else await navigator.clipboard.writeText(window.location.href);
              setCommunityNotice(navigator.share ? 'Room invite opened.' : 'Room link copied.');
            } catch (error) {
              if (error.name !== 'AbortError') setCommunityError('The room invite could not be shared.');
            }
          };

          const startPayment = async () => {
            setPaymentBusy(true);
            setPaymentError('');
            window.haloStats?.track('payment_checkout_started');

            try {
              const response = await fetch('/api/payment-link', { headers: { Accept: 'application/json' } });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || !data.checkoutUrl) throw new Error(data.message || 'Secure checkout could not be opened.');

              const checkoutUrl = new URL(data.checkoutUrl);
              if (checkoutUrl.protocol !== 'https:') throw new Error('Secure checkout could not be opened.');
              window.location.assign(checkoutUrl.href);
            } catch (error) {
              setPaymentError(error.message || 'Secure checkout could not be opened.');
              window.haloStats?.track('payment_checkout_failed');
              setPaymentBusy(false);
            }
          };

          const submitBugReport = async (e) => {
            if (e) e.preventDefault();
            if (!bugDescription.trim()) return;

            setBugFeedbackError('');
            try {
              const response = await fetch('/api/issues', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  source: 'manual',
                  category: 'user-report',
                  severity: 'medium',
                  title: `VIP tester report from ${bugDevice}`,
                  details: bugDescription,
                  pagePath: window.location.pathname,
                  fingerprint: `manual|${bugDevice}|${bugDescription.trim().toLowerCase()}`,
                  metadata: { device: bugDevice }
                })
              });
              if (!response.ok) throw new Error('The maintenance queue did not accept this report.');

              addLog(`VIP BUG REPORT QUEUED FOR MAINTENANCE [${bugDevice}]: "${bugDescription}"`);
              window.haloStats?.track('submit_bug_report', { success: true });
              setBugFeedbackSuccess(true);
              setTimeout(() => {
                setBugFeedbackSuccess(false);
                setShowBugReportModal(false);
                setBugDescription('');
              }, 1800);
            } catch (error) {
              window.haloStats?.track('submit_bug_report', { success: false });
              setBugFeedbackError(error.message || 'The report could not be submitted.');
            }
          };

          useEffect(() => {
            let unsubscribe = () => {};
            let active = true;

            const connectIdentity = async () => {
              const api = window.haloIdentity;
              if (!api || !active) return;
              const user = await api.getUser();
              if (!active) return;
              setIdentityUser(user);
              setIdentityReady(true);
              unsubscribe = api.onAuthChange((_event, nextUser) => {
                setIdentityUser(nextUser || null);
              });
            };

            if (window.haloIdentity) connectIdentity();
            else window.addEventListener('halo-identity-ready', connectIdentity, { once: true });

            return () => {
              active = false;
              unsubscribe();
              window.removeEventListener('halo-identity-ready', connectIdentity);
            };
          }, []);

          useEffect(() => {
            let active = true;
            setOwnerControlAccess(false);
            if (!identityUser?.id) return () => { active = false; };

            fetch('/api/halo-control-center', {
              method: 'HEAD',
              credentials: 'same-origin',
              cache: 'no-store'
            }).then(response => {
              if (active && response.status === 204) setOwnerControlAccess(true);
            }).catch(() => null);

            return () => { active = false; };
          }, [identityUser?.id]);

          useEffect(() => {
            loadCommunity();
            const refresh = window.setInterval(loadCommunity, 30000);
            return () => window.clearInterval(refresh);
          }, [identityUser?.id]);

          useEffect(() => {
            const requestedSlug = new URLSearchParams(window.location.search).get('slug') || '';
            loadReleasePack(requestedSlug);
          }, [identityUser?.id]);

          useEffect(() => {
            loadVideoGallery();
          }, [identityUser?.id]);

          useEffect(() => {
            if (!identityUser) {
              setUploadAlerts({ enabled: false, unreadCount: 0, notifications: [] });
              return;
            }
            loadUploadAlerts(true);
            const refresh = window.setInterval(() => loadUploadAlerts(true), 45000);
            return () => window.clearInterval(refresh);
          }, [identityUser?.id]);

          useEffect(() => {
            const openCompanionRoute = () => {
              const requestedRoom = new URLSearchParams(window.location.search).get('room');
              if (window.location.hash !== '#clubhouse' && !['mixes', 'selectors'].includes(requestedRoom)) return;
              setViewMode('console');
              setActiveTab(requestedRoom === 'selectors' ? 'selectors' : 'party');
              window.requestAnimationFrame(() => document.getElementById('clubhouse')?.scrollIntoView({ behavior: 'smooth' }));
            };
            openCompanionRoute();
            window.addEventListener('hashchange', openCompanionRoute);
            return () => window.removeEventListener('hashchange', openCompanionRoute);
          }, []);

          useEffect(() => {
            if (!canvasRef.current) return;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let animationId;
            let rotation = 0;

            const render = () => {
              ctx.fillStyle = 'rgba(7, 7, 9, 0.25)';
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              const centerX = canvas.width / 2;
              const centerY = canvas.height / 2;
              const baseRadius = Math.min(centerX, centerY) * 0.45;

              let waveAmplitude = isPlaying ? 35 + Math.sin(Date.now() / 150) * 15 : 8;
              rotation += 0.005;

              ctx.beginPath();
              for (let i = 0; i <= 100; i++) {
                const angle = (i / 100) * Math.PI * 2 + rotation;
                const noise = Math.sin(angle * 10 + rotation * 6) * (waveAmplitude * 0.25);
                const r = baseRadius + 35 + noise;
                const x = centerX + Math.cos(angle) * r;
                const y = centerY + Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = activeTrack.waveColor;
              ctx.lineWidth = 3;
              ctx.shadowBlur = 20;
              ctx.shadowColor = activeTrack.waveColor;
              ctx.stroke();

              animationId = requestAnimationFrame(render);
            };

            render();
            return () => cancelAnimationFrame(animationId);
          }, [isPlaying, activeTrack]);

          useEffect(() => {
            if (!isAdaptiveMode) return;

            const interval = setInterval(() => {
              setCrowdMetrics(previous => {
                const tempo = typeof activeTrack.bpm === 'number' ? activeTrack.bpm : 120;
                const drift = (range) => (Math.random() - 0.5) * range;
                const next = {
                  energy: clampMetric(previous.energy + (isPlaying ? ((tempo - 116) / 5) : -3) + drift(8)),
                  tension: clampMetric(previous.tension + (isPlaying ? 2 : -4) + drift(10)),
                  cohesion: clampMetric(previous.cohesion + (isPlaying ? 1 : -2) + drift(6)),
                  novelty: clampMetric(previous.novelty - (isPlaying ? 2 : 0.5) + drift(5)),
                  fatigue: clampMetric(previous.fatigue + (isPlaying ? 1.5 : -2) + drift(4))
                };
                setAiDecision(getCrowdDecision(next));
                return next;
              });
            }, 2400);

            return () => clearInterval(interval);
          }, [isAdaptiveMode, isPlaying, activeTrack]);

          const openConsoleArea = (tab) => {
            setActiveTab(tab);
            setViewMode('console');
            setShowFanGuide(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const activeWorld = WORLD_ROOMS.find(room => room.id === activeWorldId) || WORLD_ROOMS[0];
          const cuedWorld = WORLD_ROOMS.find(room => room.id === cuedWorldId);

          const selectWorldRoom = (roomId) => {
            stopWorldCinematic();
            setActiveWorldId(roomId);
            setCuedWorldId(current => current === roomId ? '' : current);
            window.haloStats?.track('select_world_room', { room_id: roomId, source: 'room_card' });
          };

          const cueWorldRoom = (roomId) => {
            if (roomId === activeWorldId) return;
            setCuedWorldId(current => current === roomId ? '' : roomId);
            window.haloStats?.track('cue_world_room', { room_id: roomId });
          };

          const takeCuedWorldLive = () => {
            if (!cuedWorld) return;
            stopWorldCinematic();
            setActiveWorldId(cuedWorld.id);
            setCuedWorldId('');
            window.haloStats?.track('take_cued_world_live', { room_id: cuedWorld.id });
          };

          const stopWorldCinematic = () => {
            worldCinematicTimers.current.forEach(timer => window.clearTimeout(timer));
            worldCinematicTimers.current = [];
            setCinematicShot('');
            setCinematicRunning(false);
          };

          const playWorldCinematic = () => {
            if (cinematicRunning) return;
            stopWorldCinematic();
            setCinematicRunning(true);
            setCinematicShot('fireworks');
            worldCinematicTimers.current = [
              window.setTimeout(() => setCinematicShot('drone'), 2600),
              window.setTimeout(() => setCinematicShot('ground'), 5700),
              window.setTimeout(() => {
              setCinematicShot('');
              setCinematicRunning(false);
                worldCinematicTimers.current = [];
              }, 8900)
            ];
          };

          useEffect(() => () => worldCinematicTimers.current.forEach(timer => window.clearTimeout(timer)), []);

          return (
            <div className="min-h-screen bg-[#070709] text-gray-100 flex flex-col font-mono selection:bg-purple-600 selection:text-white relative">

              {/* HALO MEMBERSHIP */}
              {showIdentityModal && (
                <div className="fixed inset-0 z-[110] grid place-items-center bg-black/85 p-4 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="membership-title" onClick={(event) => { if (event.target === event.currentTarget) setShowIdentityModal(false); }}>
                  <div className="relative w-full max-w-md overflow-hidden rounded-[2rem] border border-amber-300/35 bg-[#0b090d] p-6 shadow-[0_30px_100px_rgba(0,0,0,0.85)] md:p-8">
                    <div className="pointer-events-none absolute -right-20 -top-24 h-56 w-56 rounded-full bg-amber-300/10 blur-3xl"></div>
                    <button type="button" onClick={() => setShowIdentityModal(false)} className="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-full border border-white/10 text-lg text-gray-400 transition hover:border-amber-300 hover:text-white" aria-label="Close membership">×</button>
                    <div className="relative">
                      <p className="text-[10px] font-black uppercase tracking-[0.28em] text-amber-300">HALO Membership</p>
                      <h2 id="membership-title" className="mt-3 text-3xl font-black tracking-tight text-white">{identityMode === 'signup' ? 'Find your place in the room.' : 'Welcome back to the music.'}</h2>
                      <p className="mt-3 text-sm leading-6 text-gray-400">Membership protects your identity, keeps your profile between shows, and lets you chat, follow, vote, and pass the light.</p>

                      {identityNotice && <div className="mt-4 rounded-xl border border-cyan-300/25 bg-cyan-300/10 px-3 py-2 text-xs leading-5 text-cyan-100">{identityNotice}</div>}
                      {identityError && <div role="alert" className="mt-4 rounded-xl border border-red-400/35 bg-red-500/10 px-3 py-2 text-xs leading-5 text-red-200">{identityError}</div>}

                      <form onSubmit={submitIdentity} className="mt-5 space-y-3">
                        {identityMode === 'signup' && <label className="block text-[10px] font-black uppercase tracking-widest text-gray-400">Display name<input required minLength="2" maxLength="32" value={identityForm.name} onChange={(event) => setIdentityForm(previous => ({...previous, name: event.target.value}))} className="mt-1.5 w-full rounded-xl border border-white/10 bg-black/60 px-4 py-3 text-sm normal-case tracking-normal text-white outline-none transition focus:border-amber-300" placeholder="How the room knows you" /></label>}
                        <label className="block text-[10px] font-black uppercase tracking-widest text-gray-400">Email<input required type="email" value={identityForm.email} onChange={(event) => setIdentityForm(previous => ({...previous, email: event.target.value}))} className="mt-1.5 w-full rounded-xl border border-white/10 bg-black/60 px-4 py-3 text-sm normal-case tracking-normal text-white outline-none transition focus:border-amber-300" placeholder="you@example.com" /></label>
                        <label className="block text-[10px] font-black uppercase tracking-widest text-gray-400">Password<input required type="password" minLength="8" value={identityForm.password} onChange={(event) => setIdentityForm(previous => ({...previous, password: event.target.value}))} className="mt-1.5 w-full rounded-xl border border-white/10 bg-black/60 px-4 py-3 text-sm normal-case tracking-normal text-white outline-none transition focus:border-amber-300" placeholder="At least 8 characters" /></label>
                        <button type="submit" disabled={identityBusy || !identityReady} className="w-full rounded-xl bg-amber-300 px-5 py-3.5 text-sm font-black uppercase tracking-wider text-black transition hover:bg-amber-200 disabled:cursor-wait disabled:opacity-50">{identityBusy ? 'Connecting…' : identityMode === 'signup' ? 'Join the community' : 'Enter the room'}</button>
                      </form>

                      <button type="button" onClick={() => { setIdentityMode(identityMode === 'signup' ? 'login' : 'signup'); setIdentityError(''); setIdentityNotice(''); }} className="mt-4 w-full text-center text-xs text-gray-400 transition hover:text-white">{identityMode === 'signup' ? 'Already a member? Sign in' : 'New to HALO? Create a free membership'}</button>
                    </div>
                  </div>
                </div>
              )}

              {/* NEW UPLOAD ALERTS */}
              {showUploadAlerts && (
                <div className="fixed inset-0 z-[110] grid place-items-center bg-black/85 p-4 backdrop-blur-md" role="dialog" aria-modal="true" aria-labelledby="upload-alerts-title" onClick={(event) => { if (event.target === event.currentTarget) setShowUploadAlerts(false); }}>
                  <section className="relative max-h-[85vh] w-full max-w-lg overflow-y-auto rounded-[2rem] border border-cyan-300/30 bg-[#080c10] p-6 shadow-[0_30px_100px_rgba(0,0,0,0.85)] md:p-8">
                    <button type="button" onClick={() => setShowUploadAlerts(false)} className="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-full border border-white/10 text-lg text-gray-400 transition hover:border-cyan-300 hover:text-white" aria-label="Close upload alerts">×</button>
                    <p className="text-[10px] font-black uppercase tracking-[0.28em] text-cyan-300">New music signal</p>
                    <h2 id="upload-alerts-title" className="mt-3 pr-10 text-3xl font-black tracking-tight text-white">Ping me when a mix lands.</h2>
                    <p className="mt-3 text-sm leading-6 text-gray-400">Alerts stay with your HALO membership. Open HALO on your phone and enable browser notifications there for phone pings—no phone number is stored.</p>

                    {uploadAlertsError && <div role="alert" className="mt-4 rounded-xl border border-red-400/35 bg-red-500/10 px-3 py-2 text-xs leading-5 text-red-200">{uploadAlertsError}</div>}

                    <div className="mt-5 flex flex-wrap items-center gap-3 rounded-2xl border border-white/10 bg-black/35 p-4">
                      <div className="min-w-0 flex-1">
                        <strong className="block text-sm text-white">Upload alerts are {uploadAlerts.enabled ? 'on' : 'off'}</strong>
                        <span className="mt-1 block text-[10px] leading-4 text-gray-500">In-app alerts work while you browse. Browser pings require notification permission on each device.</span>
                      </div>
                      <button type="button" disabled={uploadAlertsBusy} onClick={() => updateUploadAlerts(uploadAlerts.enabled ? 'disable' : 'enable')} className={`rounded-full px-4 py-2 text-[9px] font-black uppercase tracking-widest transition disabled:opacity-50 ${uploadAlerts.enabled ? 'border border-white/15 text-gray-300 hover:border-red-300/50 hover:text-red-200' : 'bg-cyan-300 text-black hover:bg-cyan-200'}`}>{uploadAlertsBusy ? 'Updating…' : uploadAlerts.enabled ? 'Turn off' : 'Turn on'}</button>
                    </div>

                    <div className="mt-6">
                      <div className="flex items-center justify-between gap-3">
                        <h3 className="text-[10px] font-black uppercase tracking-[0.24em] text-gray-400">Recent uploads</h3>
                        <span className="text-[9px] uppercase tracking-widest text-cyan-300">{uploadAlerts.notifications.length} signals</span>
                      </div>
                      <div className="mt-3 space-y-2">
                        {uploadAlerts.notifications.length ? uploadAlerts.notifications.map(item => (
                          <a key={item.id} href={item.roomUrl} className="block rounded-2xl border border-white/10 bg-black/35 p-4 transition hover:border-cyan-300/35 hover:bg-cyan-300/5">
                            <div className="flex items-start justify-between gap-3">
                              <div className="min-w-0"><strong className="block truncate text-sm text-white">{item.title}</strong><span className="mt-1 block text-[10px] text-gray-500">{item.creatorName} · {new Date(item.createdAt).toLocaleString()}</span></div>
                              {item.unread && <span className="mt-1 h-2 w-2 shrink-0 rounded-full bg-cyan-300 shadow-[0_0_12px_rgba(103,232,249,.8)]" aria-label="New"></span>}
                            </div>
                          </a>
                        )) : <div className="rounded-2xl border border-dashed border-white/10 p-5 text-center text-xs leading-5 text-gray-500">Turn alerts on and new public uploads appear here.</div>}
                      </div>
                    </div>
                  </section>
                </div>
              )}

              {/* FAN WAYFINDER */}
              {showFanGuide && (
                <div
                  className="fixed inset-0 z-[100] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 font-sans-alt"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="fan-guide-title"
                  onClick={(event) => {
                    if (event.target === event.currentTarget) setShowFanGuide(false);
                  }}
                >
                  <div className="relative max-h-[calc(100vh-2rem)] w-full max-w-4xl overflow-y-auto overflow-x-hidden rounded-[2rem] border border-amber-400/50 bg-[#0a0a0f] shadow-[0_30px_100px_rgba(0,0,0,0.8)]">
                    <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-amber-300 to-transparent"></div>
                    <button
                      type="button"
                      onClick={() => setShowFanGuide(false)}
                      className="absolute right-4 top-4 z-10 grid h-10 w-10 place-items-center rounded-full border border-white/10 bg-black/60 text-xl text-gray-300 transition hover:border-amber-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-amber-300"
                      aria-label="Close fan guide"
                    >
                      ×
                    </button>

                    <div className="grid lg:grid-cols-[0.8fr_1.2fr]">
                      <div className="relative overflow-hidden border-b border-purple-950/70 bg-[radial-gradient(circle_at_20%_10%,rgba(245,158,11,0.2),transparent_42%),linear-gradient(145deg,#120b05,#09090d_68%)] p-7 md:p-10 lg:border-b-0 lg:border-r">
                        <span className="text-[10px] font-black uppercase tracking-[0.3em] text-amber-400">HALO FAN WAYFINDER</span>
                        <h2 id="fan-guide-title" className="mt-4 max-w-sm text-4xl font-black leading-[0.92] tracking-[-0.05em] text-white md:text-5xl">
                          YOU ARE NOT SUPPOSED TO KNOW WHERE TO GO YET.
                        </h2>
                        <p className="mt-5 max-w-sm text-sm leading-6 text-gray-400">
                          Pick what sounds fun. HALO takes you directly to the right room, and you can always return home by selecting the logo.
                        </p>
                        <div className="mt-8 flex items-center gap-3 text-xs text-gray-500">
                          <span className="grid h-8 w-8 place-items-center rounded-full border border-amber-500/40 text-amber-300">01</span>
                          <span>Choose a path</span>

                  <section className="lg:col-span-3 border-t lg:border-t-0 border-purple-950/30 bg-[#09090d] flex flex-col p-4 space-y-4">
                    <div className="bg-[#0b0b10] border border-purple-950/50 p-3 rounded-lg flex-1 flex flex-col">
                      <div className="mb-2 flex items-center justify-between border-b border-purple-950 pb-1"><span className="font-bold text-purple-400 text-xs">{activeTab === 'party' ? 'CLUBHOUSE CHAT' : 'SESSION CHAT'}</span>{activeTab === 'party' && <span className="text-[8px] uppercase text-gray-600">House crew + members · Slow mode</span>}</div>
                      <div className="flex-1 overflow-y-auto space-y-2 max-h-[220px] text-[11px]">
                        {activeTab === 'party' && community ? (community.messages.length ? community.messages.map(message => (
                          <div key={message.id} className={`rounded-lg border p-2 ${message.is_spotlighted ? 'border-amber-400/40 bg-amber-400/10' : 'border-transparent bg-black/30'}`}>
                            <div className="flex items-center justify-between gap-2"><button type="button" onClick={() => setNewComment(`@${message.display_name.replace(/\s+/g, '')} `)} className="truncate font-bold text-rose-300 hover:text-amber-200">{message.avatar} {message.display_name}</button><div className="flex items-center gap-1">{message.is_host && <span className="rounded-full border border-cyan-300/25 bg-cyan-300/10 px-1.5 py-0.5 text-[7px] font-black uppercase text-cyan-200">Official crew</span>}{message.is_spotlighted && <span className="text-[7px] font-black uppercase text-amber-300">Spotlight</span>}</div></div>
                            <p className="mt-1 text-gray-300 font-sans">{message.body}</p>
                            <div className="mt-2 flex flex-wrap items-center gap-1">{['✨','💜','🔥','🌊'].map(emoji => <button key={emoji} type="button" onClick={() => communityAction({action: 'reaction', messageId: message.id, emoji})} className="rounded-full border border-white/5 bg-white/[0.025] px-1.5 py-0.5 text-[9px] hover:border-purple-300/30">{emoji}{message.reactions?.[emoji] ? ` ${message.reactions[emoji]}` : ''}</button>)}<button type="button" onClick={() => identityUser ? setCommunityReply({id: message.id, name: message.display_name}) : openIdentity('signup', 'Join HALO to reply and be recognized in the room.')} className="ml-auto text-[8px] uppercase text-gray-500 hover:text-white">Reply</button>{message.actor_id !== community.profile?.actor_id && <button type="button" onClick={() => reportCommunityItem({targetId: message.actor_id, messageId: message.id})} className="text-[8px] uppercase text-gray-600 hover:text-red-300">Report</button>}</div>
                          </div>
                        )) : <div className="rounded-xl border border-dashed border-cyan-300/20 bg-cyan-300/5 p-4 text-center"><p className="font-bold text-cyan-100">The house crew is opening the room.</p><p className="mt-1 text-[9px] text-gray-500">Choose a prompt above or introduce your city.</p></div>) : chatMessages.map((msg, i) => (
                          <div key={i} className="bg-black/30 p-2 rounded"><span className={`font-bold block ${msg.color}`}>{msg.user}:</span><p className="text-gray-300 font-sans">{msg.text}</p></div>
                        ))}
                      </div>
                      {activeTab === 'party' && communityReply && <div className="mt-2 flex items-center justify-between rounded bg-purple-950/30 px-2 py-1 text-[8px] text-purple-200"><span>Replying to {communityReply.name}</span><button type="button" onClick={() => setCommunityReply(null)}>×</button></div>}
                      <form onSubmit={activeTab === 'party' ? submitCommunityMessage : submitMessage} className="mt-2 flex gap-1">
                        <input
                          type="text"
                          placeholder={activeTab === 'party' ? (identityUser ? 'Add to the room…' : 'Join to add to the room…') : 'Say something...'}
                          value={newComment}
                          onChange={(e) => setNewComment(e.target.value)}
                          maxLength={activeTab === 'party' ? 320 : undefined}
                          className="flex-1 bg-black border border-purple-950 px-2 py-1 text-xs text-white"
                        />
                        <button type="submit" className="bg-purple-950 text-purple-300 px-2 rounded">
                          <Icon name="send" className="h-3 w-3" />
                        </button>
                      </form>
                    </div>

                    <div className="bg-[#0b0b10] border border-purple-950 p-3 rounded-lg flex-1 text-[10px] font-mono">
                      <span className="font-bold text-rose-500 block mb-1">TERMINAL LOGS</span>
                      <div className="space-y-1 text-gray-400 max-h-[140px] overflow-y-auto">
                        {terminalLogs.map((log, i) => (
                          <p key={i}>{log}</p>
                        ))}
                      </div>
                    </div>
                  </section>

                </div>
              )}

              {showEqualizer && <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-4 backdrop-blur-sm sm:items-center" role="dialog" aria-modal="true" aria-labelledby="equalizer-title" onMouseDown={event => { if (event.target === event.currentTarget) setShowEqualizer(false); }}><section className="w-full max-w-xl overflow-hidden rounded-3xl border border-cyan-300/30 bg-[#080b0f] shadow-[0_30px_100px_rgba(0,0,0,.75)]"><div className="flex items-start justify-between border-b border-white/10 bg-gradient-to-r from-cyan-950/50 to-purple-950/30 p-5"><div><p className="text-[9px] font-black uppercase tracking-[0.3em] text-cyan-300">Always-on sound control</p><h2 id="equalizer-title" className="mt-1 text-xl font-black uppercase text-white">HALO Equalizer</h2><p className="mt-1 text-[10px] text-gray-400">Shape local mixes and HALO audio without leaving the room.</p></div><button type="button" onClick={() => setShowEqualizer(false)} className="grid h-9 w-9 place-items-center rounded-full border border-white/10 text-gray-400 hover:text-white" aria-label="Close equalizer">×</button></div><div className="grid gap-5 p-5 sm:grid-cols-4">{[
                ['master', 'Master', 0, 100, '%'],
                ['bass', 'Bass', -12, 12, ' dB'],
                ['mid', 'Mid', -12, 12, ' dB'],
                ['treble', 'Treble', -12, 12, ' dB']
              ].map(([band, label, min, max, suffix]) => <label key={band} className="rounded-2xl border border-white/10 bg-white/[0.03] p-4 text-center"><span className="text-[9px] font-black uppercase tracking-widest text-gray-400">{label}</span><input aria-label={`${label} level`} type="range" min={min} max={max} value={equalizer[band]} onChange={event => updateEqualizer(band, event.target.value)} className="my-5 h-2 w-full accent-cyan-300"/><strong className="block text-lg text-white">{equalizer[band] > 0 && band !== 'master' ? '+' : ''}{equalizer[band]}{suffix}</strong></label>)}</div>{equalizer.master > 85 && <p role="alert" className="mx-5 mb-5 rounded-xl border border-amber-300/30 bg-amber-300/10 px-3 py-2 text-[10px] leading-4 text-amber-200">High volume can damage hearing. Raise the level gradually and protect everyone in the room.</p>}<div className="flex flex-wrap items-center justify-between gap-3 border-t border-white/10 px-5 py-4"><button type="button" onClick={resetEqualizer} className="text-[8px] font-black uppercase tracking-widest text-gray-500 hover:text-white">Reset balanced</button><span className="text-[8px] uppercase tracking-widest text-cyan-300">Settings stay available during every room</span></div></section></div>}

              <button type="button" onClick={() => setShowEqualizer(true)} className="halo-floating-action halo-floating-equalizer fixed bottom-20 right-4 z-30 flex items-center gap-2 rounded-full border border-cyan-300/50 bg-[#061318]/95 px-4 py-3 text-[10px] font-black uppercase tracking-widest text-cyan-200 shadow-[0_12px_40px_rgba(0,0,0,0.55)] backdrop-blur transition hover:-translate-y-1 hover:border-cyan-100 hover:text-white focus:outline-none focus:ring-2 focus:ring-cyan-300" aria-label="Open equalizer"><span className="text-base">≋</span><span className="halo-floating-label">Equalizer</span></button>

              <button
                type="button"
                onClick={() => setShowFanGuide(true)}
                className="halo-floating-action halo-floating-guide fixed bottom-4 right-4 z-30 flex items-center gap-2 rounded-full border border-amber-400/50 bg-[#120d07]/95 px-4 py-3 text-[10px] font-black uppercase tracking-widest text-amber-300 shadow-[0_12px_40px_rgba(0,0,0,0.55)] backdrop-blur transition hover:-translate-y-1 hover:border-amber-200 hover:text-white focus:outline-none focus:ring-2 focus:ring-amber-300"
                aria-label="Open the fan guide"
              >
                <span className="grid h-5 w-5 place-items-center rounded-full bg-amber-400 text-xs text-black">?</span>
                <span className="halo-floating-label hidden sm:inline">Need directions?</span>
              </button>

              {/* FOOTER */}
              <footer className="border-t border-purple-950/40 bg-[#07070a] px-4 py-2 flex flex-wrap justify-between items-center gap-2 text-[9px] text-gray-500 font-mono">
                <span>© 2026 HALO MUSIC WORLD SYSTEMS LLC</span>
                <nav className="flex items-center gap-3" aria-label="HALO social profiles">
                  <a href="/support/" data-stat-event="open_feedback_desk" data-stat-target="footer" className="text-lime-300 transition hover:text-lime-200 focus:outline-none focus:ring-1 focus:ring-lime-300">FEEDBACK</a>
                  <span aria-hidden="true">·</span>
                  <a
                    href="https://www.youtube.com/@halo-music-world"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-stat-event="open_social_profile"
                    data-stat-target="youtube_footer"
                    className="text-red-300 transition hover:text-red-200 focus:outline-none focus:ring-1 focus:ring-red-300"
                  >
                    YOUTUBE
                  </a>
                  <span aria-hidden="true">·</span>
                  <a
                    href="https://www.tiktok.com/@halomusicworldhome"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-stat-event="open_social_profile"
                    data-stat-target="tiktok_footer"
                    className="text-cyan-300 transition hover:text-cyan-200 focus:outline-none focus:ring-1 focus:ring-cyan-300"
                  >
                    TIKTOK
                  </a>
                </nav>
                <span>PUBLIC REACH · DIRECT RELATIONSHIPS · PROFESSIONAL DELIVERY</span>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
