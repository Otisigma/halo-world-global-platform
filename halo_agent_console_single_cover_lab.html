        const Icon = ({ name, className }) => {

        function App() {
          const [isAuthorized, setIsAuthorized] = useState(false);

          const [authError, setAuthError] = useState('');
          
          const [activeTrack, setActiveTrack] = useState(INITIAL_TRACKS[0]);
          const [tracks, setTracks] = useState(INITIAL_TRACKS); 
          const [isPlaying, setIsPlaying] = useState(false);
          const [isMuted, setIsMuted] = useState(false);
          const [activeTab, setActiveTab] = useState('agent-room'); 

          const [uploadProgress, setUploadProgress] = useState(0);
          const [activeAgentId, setActiveAgentId] = useState(null);
          const [agentProgress, setAgentProgress] = useState(0);
          const [isProcessing, setIsProcessing] = useState(false);
          const [processingStatus, setProcessingStatus] = useState('');
          
          const [localBinaryBuffer, setLocalBinaryBuffer] = useState(null);
          const [importedVideoUrl, setImportedVideoUrl] = useState(null);

          const [verificationReport, setVerificationReport] = useState([
            { id: 'headers', label: 'Inspect Binary Headers', status: 'STANDBY', log: 'Awaiting raw media payload drop...' },
            { id: 'decoder', label: 'Web Audio Decode Handshake', status: 'STANDBY', log: 'Integrity scanner on standby...' },

          ]);

          const [agents, setAgents] = useState({
            gemma: { name: 'Gemma', role: 'Spectral & Latency Monitor', status: 'STANDBY', log: 'Ready to scan audio container...' },
            mason: { name: 'Mason', role: 'Adaptive Audio/Video DSP', status: 'STANDBY', log: 'Limiter limits calibrated at +4dB.' },
            cipher: { name: 'Cipher', role: 'Cryptographic License Shield', status: 'STANDBY', log: 'Standby to issue cryptographic signature.' },

            echo: { name: 'Echo', role: 'Wallet Pass Outreach Engine', status: 'STANDBY', log: 'Sync lines open to 142 dynamic wallet nodes.' }
          });

          const [prePartyPool, setPrePartyPool] = useState([
            { id: 'pre-1', title: 'Glass House (Acid Sunset Edit)', key: '8A', bpm: 125, progress: 74, encrypted: true },
            { id: 'pre-2', title: 'What I\'ve Learned (Vesper Slow Burn Mix)', key: '11B', bpm: 110, progress: 48, encrypted: true },
            { id: 'pre-3', title: 'A Beautiful Lie (Ibiza Terrace VIP)', key: '5A', bpm: 122, progress: 92, encrypted: true }
          ]);

          const [feedbackVibe, setFeedbackVibe] = useState(74);
          const [feedbackDrop, setFeedbackDrop] = useState(80);
          const [feedbackTransition, setFeedbackTransition] = useState(65);
          const [aggregateFeedback, setAggregateFeedback] = useState({ vibe: 79, drop: 82, trans: 72, count: 142 });

          const [showWinnerModal, setShowWinnerModal] = useState(false);
          const [winnerTrackName, setWinnerTrackName] = useState('');

          const [isRaidActive, setIsRaidActive] = useState(false);
          const [raidProgress, setRaidProgress] = useState(0);
          const [raidStats, setRaidStats] = useState({ views: 420, likes: 18, completion: 8, comments: 2 });
          const [raidLog, setRaidLog] = useState(['Defibrillator System Status: STANDBY', 'Paste/Select TikTok target above to prime raid geofences.']);

          const [chatMessages, setChatMessages] = useState([
            { user: 'Kaelen_Ibiza', text: 'Closest Thing To Heaven is a total sunrise anthem! 🌅', color: 'text-amber-400' },
            { user: 'Sasha_London', text: 'This remix completely floats above the terrace.', color: 'text-purple-400' }
          ]);
          const [newComment, setNewComment] = useState('');

          const [terminalLogs, setTerminalLogs] = useState([
            'SYSTEM BOOT // HMW-OS v4.9.8-STABLE',
            'Listening Party Hub Initialized: ONLINE',
            'Cover Artwork Engine: ACTIVE & READY',
            'Standby for live co-creation handshake...'
          ]);

          const audioCtxRef = useRef(null);
          const synthIntervalRef = useRef(null);
          const canvasRef = useRef(null);
          const confettiCanvasRef = useRef(null); // Fixed missing ref declaration
          const celebrationIndexRef = useRef(0);  // Fixed missing ref declaration
          const analyzerRef = useRef(null);
          const gainNodeRef = useRef(null);
          const filterNodeRef = useRef(null);
          const activeSourceNodeRef = useRef(null);
          const [isFilterActive, setIsFilterActive] = useState(false);

          useEffect(() => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
          });

          const addLog = (msg) => {
            const timestamp = new Date().toLocaleTimeString();
            setTerminalLogs(prev => [`[${timestamp}] ${msg}`, ...prev.slice(0, 30)]);
          };

          const handleCoverUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
              addLog(`COVER ERROR: File "${file.name}" is not a valid image file.`);
              return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
              const newImageUrl = event.target.result;
              setCustomCoverUrl(newImageUrl);

              // Update active track's cover image state directly
              const updatedTrack = { ...activeTrack, coverUrl: newImageUrl };
              setActiveTrack(updatedTrack);

              // Update track in global list so switching tracks preserves artwork
              setTracks(prev => prev.map(t => t.id === activeTrack.id ? updatedTrack : t));

              addLog(`SINGLE ARTWORK UPDATED: Custom cover image applied to "${activeTrack.title}".`);
            };
            reader.readAsDataURL(file);
          };

          const handleMediaUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
              handleCoverUpload(e);
              return;
            }

            setIsProcessing(true);
            setUploadProgress(10);
            setProcessingStatus('Gemma is inspecting binary container headers...');
            addLog(`FILE INBOUND: Uploading "${file.name}"...`);

            setImportedVideoUrl(null);
            setLocalBinaryBuffer(null);
            
            setVerificationReport([
              { id: 'headers', label: 'Inspect Binary Headers', status: 'PROCESSING', log: 'Checking magic bytes...' },
              { id: 'decoder', label: 'Web Audio Decode Handshake', status: 'STANDBY', log: 'Waiting on file upload...' },
              { id: 'peaks', label: 'Transient Headroom Check', status: 'STANDBY', log: 'Waiting on decode pass...' },
              { id: 'license', label: 'Pioneer Rekordbox Registry', status: 'STANDBY', log: 'Waiting on dsp validation...' }
            ]);

            const isVideo = file.type.startsWith('video/');

            setTimeout(() => {
              setVerificationReport(prev => prev.map(step => 
                step.id === 'headers' 
                  ? { ...step, status: 'COMPLETE', log: `Valid ${isVideo ? 'MP4 Video' : 'WAV/MP3 Audio'} magic headers identified.` }
                  : step.id === 'decoder'
                    ? { ...step, status: 'PROCESSING', log: 'Initializing local FileReader Binary Sandbox...' }
                    : step
              ));
              setAgentProgress(30);

              const reader = new FileReader();
              reader.onload = (event) => {
                const arrayBuffer = event.target.result;
                initAudio();
                
                const ctx = audioCtxRef.current;
                addLog(`BINARY LOADED: Decoding raw binary bytes for ${file.name}...`);

                ctx.decodeAudioData(arrayBuffer, (decodedBuffer) => {
                  setLocalBinaryBuffer(decodedBuffer);
                  
                  setVerificationReport(prev => prev.map(step => 
                    step.id === 'decoder' 
                      ? { ...step, status: 'COMPLETE', log: `Decoded successfully. Duration: ${Math.round(decodedBuffer.duration)}s.` }
                      : step.id === 'peaks'
                        ? { ...step, status: 'PROCESSING', log: 'Measuring RMS level limits...' }
                        : step
                  ));
                  
                  setAgentProgress(60);

                  setTimeout(() => {
                    setVerificationReport(prev => prev.map(step => 
                      step.id === 'peaks' 
                        ? { ...step, status: 'COMPLETE', log: 'Averages resolved at -14.2 LUFS. Ceiling locked at +4dB.' }
                        : step.id === 'license'
                          ? { ...step, status: 'PROCESSING', log: 'Issuing dynamic XML rekordbox cues...' }
                          : step
                    ));
                    setAgentProgress(85);

                    setTimeout(() => {
                      setVerificationReport(prev => prev.map(step => 
                        step.id === 'license' 
                          ? { ...step, status: 'COMPLETE', log: 'Rekordbox XML database matched. 5 HotCues mapped.' }
                          : step
                      ));
                      setAgentProgress(100);
                      setUploadProgress(100);
                      
                      let vidUrl = null;
                      if (isVideo) {
                        vidUrl = URL.createObjectURL(file);
                        setImportedVideoUrl(vidUrl);
                      }

                      runAgentPipeline(file.name, isVideo, decodedBuffer, vidUrl);
                    }, 800);
                  }, 800);

                }, (err) => {
                  console.error("Audio decoding failed:", err);
                  setIsProcessing(false);
                  addLog(`DECODER FAIL: Gemma rejected "${file.name}".`);
                });
              };

              reader.readAsArrayBuffer(file);
            }, 800);
          };

          const runAgentPipeline = (filename, isVideo, decodedBuffer, videoUrl) => {
            setProcessingStatus('Handing track to Gemma for structural analysis...');
            
            setTimeout(() => {
              setActiveAgentId('gemma');
              setAgents(prev => ({ ...prev, gemma: { ...prev.gemma, status: 'PROCESSING', log: `Scanning transients of ${filename}...` } }));

              setTimeout(() => {
                setAgents(prev => ({
                  ...prev,
                  gemma: { ...prev.gemma, status: 'COMPLETE', log: 'BPM identified: 123. Key: 5A (D Minor).' },
                  mason: { ...prev.mason, status: 'PROCESSING', log: 'Calibrating peak limiting arrays...' }
                }));
                setActiveAgentId('mason');

                setTimeout(() => {
                  setAgents(prev => ({
                    ...prev,
                    mason: { ...prev.mason, status: 'COMPLETE', log: 'Dynamic EQ applied.' },
                    cipher: { ...prev.cipher, status: 'PROCESSING', log: 'Auditing SSL lines...' }
                  }));
                  setActiveAgentId('cipher');

                  setTimeout(() => {
                    setAgents(prev => ({
                      ...prev,
                      cipher: { ...prev.cipher, status: 'COMPLETE', log: 'Security hash: 0x98A1_FF4A issued.' },
                      llama: { ...prev.llama, status: 'PROCESSING', log: 'Injecting dynamic paths...' }
                    }));
                    setActiveAgentId('llama');

                    setTimeout(() => {
                      setAgents(prev => ({
                        ...prev,
                        llama: { ...prev.llama, status: 'COMPLETE', log: 'Local routing paths mapped safely.' },
                        echo: { ...prev.echo, status: 'PROCESSING', log: 'Generating push indicators...' }
                      }));
                      setActiveAgentId('echo');

                      setTimeout(() => {
                        setAgents(prev => ({
                          ...prev,
                          echo: { ...prev.echo, status: 'COMPLETE', log: 'Broadcast complete.' }
                        }));
                        setIsProcessing(false);
                        setActiveAgentId(null);
                        setProcessingStatus('');
                        
                        const cleanName = filename.replace(/\.[^/.]+$/, "");
                        const newTrackObj = {
                          id: `uploaded-${Date.now()}`,
                          title: cleanName,
                          version: isVideo ? 'Master High-Retention Video' : 'Master Audio Upload',
                          bpm: 123,
                          key: '5A (D Minor)',
                          genre: isVideo ? 'Vibe Video Sync' : 'Melodic Progressive',
                          persona: 'DJ_BUTTERFLY',
                          personaLabel: "DJ Butterfly // The Sunset Terrace",
                          energy: 'Dynamic Sync (7/10)',
                          waveColor: '#a855f7',
                          synthPattern: 'progressive',
                          isBinarySource: true,
                          binaryBuffer: decodedBuffer,
                          videoUrl: videoUrl,
                          coverUrl: customCoverUrl || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=800&auto=format&fit=crop',
                          chats: [
                            { user: 'System', text: `Auto-analyzed and mastered by HMW Agent Workforce! 🪐`, color: 'text-emerald-400' }
                          ]
                        };

                        setTracks(prev => [newTrackObj, ...prev]);
                        setActiveTrack(newTrackObj);
                        addLog(`WORKFORCE COMPLETE: "${cleanName}" injected into Halo Music World!`);
                      }, 800);
                    }, 800);
                  }, 800);
                }, 800);
              }, 800);
            }, 800);
          };

          const castPrePartyCompute = (id) => {
            setPrePartyPool(prev => prev.map(item => {
              if (item.id === id) {
                const nextProgress = Math.min(100, item.progress + Math.floor(Math.random() * 12) + 8);
                const newlyUnlocked = nextProgress >= 100 && item.encrypted;
                
                if (newlyUnlocked) {
                  addLog(`✓ CONSENSUS COMPLETE: "${item.title}" decrypted! Preloaded into active pool.`);
                  pushChat('Vault_AI', `Consensus locked! "${item.title}" has been successfully decrypted. 🔓`, 'text-emerald-400');
                  
                  setWinnerTrackName(item.title);
                  setShowWinnerModal(true);
                  setTimeout(() => { triggerCelebration(); }, 100);

                  setTimeout(() => {
                    const addedTrack = {
                      id: `pre-unlocked-${item.id}`,
                      title: item.title,
                      version: 'Community Decrypted Master',
                      bpm: item.bpm,
                      key: `${item.key} (Vibe Selected)`,
                      genre: item.bpm < 118 ? 'Melodic Downtempo' : item.bpm <= 123 ? 'Deep House' : 'Melodic Techno',
                      persona: item.bpm < 118 ? 'DJ_ROMY' : item.bpm <= 123 ? 'DJ_BUTTERFLY' : 'DJ_HALO',
                      personaLabel: item.bpm < 118 ? 'DJ Romy // The After-Hours Wind-Down' : item.bpm <= 123 ? 'DJ Butterfly // The Sunset Terrace' : 'DJ Halo // The Peak Vault',
                      energy: 'Consensus Weapon (9/10)',
                      waveColor: item.bpm < 118 ? '#ec4899' : item.bpm <= 123 ? '#a855f7' : '#d97706',
                      synthPattern: item.bpm < 118 ? 'transition' : 'progressive',
                      isBinarySource: false,
                      coverUrl: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop',
                      chats: [
                        { user: 'HMW_Bot', text: 'Decryption payload completed directly by crowd compute power! 🚀', color: 'text-emerald-400' }
                      ]
                    };
                    setTracks(prev => [addedTrack, ...prev]);
                    setActiveTrack(addedTrack);
                  }, 1200);
                } else {
                  addLog(`Casting compute power to node ${id}. Decryption index: ${nextProgress}%`);
                }
                return { ...item, progress: nextProgress, encrypted: nextProgress < 100 };
              }
              return item;
            }));
          };

          const triggerCelebration = () => {
            const canvas = confettiCanvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const type = celebrationIndexRef.current % 2;
            celebrationIndexRef.current++;

            if (type === 0) {
              addLog("TPO CELEBRATION ACTIVE: Confetti explosion sequence triggered.");
              runConfetti(canvas, ctx);
            } else {
              addLog("TPO CELEBRATION ACTIVE: Neon Vector Firework rocket bursts triggered.");
              runFireworks(canvas, ctx);
            }
          };

          const runConfetti = (canvas, ctx) => {
            let particles = [];
            const colors = ['#d97706', '#a855f7', '#ec4899', '#10b981', '#3b82f6'];

            for (let i = 0; i < 200; i++) {
              particles.push({
                x: canvas.width / 2,
                y: canvas.height + 50,
                r: Math.random() * 6 + 4,
                speedX: Math.random() * 12 - 6,
                speedY: Math.random() * -18 - 8,
                color: colors[Math.floor(Math.random() * colors.length)],
                tilt: Math.random() * 10 - 5,
                tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                tiltAngle: 0
              });
            }

            const animateConfetti = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              let active = false;

              particles.forEach((p) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += p.speedY;
                p.x += p.speedX;
                p.speedY += 0.28; 
                p.tilt = Math.sin(p.tiltAngle) * 12;

                if (p.y < canvas.height && p.x > 0 && p.x < canvas.width) {
                  active = true;
                }

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();
              });

              if (active) {
                requestAnimationFrame(animateConfetti);
              } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
              }
            };
            animateConfetti();
          };

          const runFireworks = (canvas, ctx) => {
            let rockets = [];
            let sparks = [];
            const colors = ['#d97706', '#a855f7', '#ec4899', '#10b981', '#06b6d4'];

            const rocketCount = Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < rocketCount; i++) {
              rockets.push({
                x: (canvas.width * 0.2) + Math.random() * (canvas.width * 0.6),
                y: canvas.height + 20,
                targetY: (canvas.height * 0.15) + Math.random() * (canvas.height * 0.35),
                speedY: Math.random() * -5 - 10,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 3 + 2,
                exploded: false
              });
            }

            const explode = (x, y, color) => {
              const sparkCount = 80;
              for (let i = 0; i < sparkCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                sparks.push({
                  x: x,
                  y: y,
                  vx: Math.cos(angle) * speed,
                  vy: Math.sin(angle) * speed,
                  color: color,
                  alpha: 1,
                  decay: Math.random() * 0.015 + 0.008,
                  gravity: 0.1,
                  friction: 0.98
                });
              }
            };

            const animateFireworks = () => {
              ctx.fillStyle = 'rgba(7, 7, 9, 0.18)';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              let active = false;

              rockets.forEach(r => {
                if (!r.exploded) {
                  r.y += r.speedY;
                  if (r.y <= r.targetY) {
                    r.exploded = true;
                    explode(r.x, r.y, r.color);
                  } else {
                    active = true;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.size, 0, Math.PI * 2);
                    ctx.fillStyle = r.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = r.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                  }
                }
              });

              sparks.forEach(s => {
                if (s.alpha > 0) {
                  active = true;
                  s.vx *= s.friction;
                  s.vy *= s.friction;
                  s.vy += s.gravity;
                  s.x += s.vx;
                  s.y += s.vy;
                  s.alpha -= s.decay;

                  ctx.beginPath();
                  ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                  ctx.fillStyle = s.color;
                  ctx.globalAlpha = s.alpha;
                  ctx.shadowBlur = 10;
                  ctx.shadowColor = s.color;
                  ctx.fill();
                  
                  ctx.globalAlpha = 1;
                  ctx.shadowBlur = 0;
                }
              });

              if (active) {
                requestAnimationFrame(animateFireworks);
              } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
              }
            };
            animateFireworks();
          };

          const initAudio = () => {
            try {
              if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
                
                const gainNode = audioCtxRef.current.createGain();
                gainNode.gain.setValueAtTime(0.15, audioCtxRef.current.currentTime);
                
                const filterNode = audioCtxRef.current.createBiquadFilter();
                filterNode.type = 'lowpass';
