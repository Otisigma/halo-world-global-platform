[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/youtube-studio*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/"
  to = "/halo"
  status = 301
  force = true

[[redirects]]
  from = "/halo"
  to = "/halo.html"
  status = 200
  force = true

[[redirects]]
  from = "/halo/"
  to = "/halo"
  status = 301
  force = true

[[redirects]]
  from = "/private"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/private/"
