[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/hmw_agent_console.html"
  status = 200
  force = true

[[redirects]]
  from = "/console"
  to = "/hmw_agent_console.html"
  status = 200
  force = true

[[redirects]]
  from = "/signal"
  to = "/signal-network.html"
  status = 200
  force = true

# Preserve existing redirect and header configuration
[[redirects]]
  from = "/"
  to = "/halo.html"
  status = 200
  force = true

[[redirects]]
  from = "/private"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/private/"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/private*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/halo.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/halo-command.html"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/partner-trust.html"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/control-center*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/artist-economy*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/youtube-studio*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/creators"
  to = "/creators/"
  status = 301

[[redirects]]
  from = "/release-house"
  to = "/release-house/"
  status = 301

[[redirects]]
  from = "/song-catalog"
  to = "/song-catalog/"
  status = 301

[[redirects]]
  from = "/finish-house"
  to = "/finish-house/"
  status = 301

[[redirects]]
  from = "/campaign-studio"
  to = "/campaign-studio/"
  status = 301

[[redirects]]
  from = "/youtube-studio"
  to = "/youtube-studio/"
  status = 301

[[redirects]]
  from = "/dreamweaver"
  to = "/dreamweaver/"
  status = 301

[[redirects]]
  from = "/dreamweaver-lab"
  to = "/dreamweaver-lab/"
  status = 301

[[redirects]]
  from = "/when-the-world-goes-dark"
  to = "/when-the-world-goes-dark/"
  status = 301

[[redirects]]
  from = "/iam-social"
  to = "/iam-social/"
  status = 301

[[redirects]]
  from = "/artist-pro"
  to = "/artist-pro/"
  status = 301

[[redirects]]
  from = "/artist-economy"
  to = "/artist-economy/"
  status = 301

[[redirects]]
  from = "/support"
