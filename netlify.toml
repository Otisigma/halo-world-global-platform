[[redirects]]
  from = "/artists/*"
  to = "/artists/index.html"
  status = 200

[[redirects]]
  from = "/control-center"
  to = "/halo-command.html"
  status = 200

[[redirects]]
  from = "/control-center/"
  to = "/halo-command.html"
  status = 200

# SPA fallback - keep after specific routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
