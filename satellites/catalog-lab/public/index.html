<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://halo-world-global-platform.netlify.app/api/release-catalog; img-src 'none'; media-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>HALO Catalog Lab — Satellite Preview</title>
  <link rel="stylesheet" href="./catalog-lab.css">
  <script type="module" src="./catalog-lab.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">HALO / Satellite preview</p>
      <h1>A new light on the catalog.</h1>
      <p>Explore public release metadata in a visual listening-room preview.</p>
      <p class="boundary">Read-only connection. No uploads, publishing, audio processing, or changes to core.
        Visual studies stay here and reset when you reload.</p>
    </header>
    <section class="controls" aria-label="Preview controls">
      <label for="palette">Visual study</label>
      <select id="palette">
        <option value="aurora">Aurora</option>
        <option value="ember">Ember</option>
        <option value="mono">Monochrome</option>
      </select>
      <label for="search">Find a release</label>
      <input id="search" type="search" placeholder="Title, artist, or genre">
      <button id="refresh" type="button">Refresh public catalog</button>
    </section>
    <p id="status" role="status" aria-live="polite">Connecting to the public catalog…</p>
    <section id="releases" class="releases" aria-label="Public release visual studies" aria-busy="true"></section>
    <noscript>This read-only preview needs JavaScript to load public release metadata.</noscript>
  </main>
</body>
</html>
